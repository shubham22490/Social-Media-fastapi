[project]
name = "learning-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.5",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pydantic-settings>=2.15.0",
    "alembic>=1.20.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
